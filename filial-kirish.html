<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filial ma'lumotlarini kiritish — Arzonchi (lokal asbob)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ilova.css">
  <style>
    /* =====================================================================
       FILIAL-KIRISH — faqat shu sahifaga tegishli uslublar (fk- prefiksi).
       Mavjud css/style.css dagi tokenlar (ranglar/oraliqlar/radiuslar) va
       tayyor sinflar (.konteyner, .tugma, .maydon, .filtr-pill, .maydon-xato)
       qayta ishlatiladi — css papkasidagi fayllar TEGILMAGAN.
       ===================================================================== */

    .fk-body { background: var(--fon-sahifa, #F1F3F6); }

    .fk-header {
      background: var(--oq, #FFFFFF);
      border-bottom: 1px solid var(--chegara-nozik, #E4E7EC);
      padding: var(--oraliq-4, 16px) 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .fk-header-ichki {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--oraliq-4, 16px);
      flex-wrap: wrap;
    }
    .fk-header-nom { font-weight: 800; font-size: 1.1rem; color: var(--qora, #141417); }
    .fk-header-belgi {
      font-weight: 600;
      font-size: var(--matn-kichik, 12px);
      color: var(--matn-qizil, #C4000F);
      border: 1px solid var(--chegara-nozik, #E3E5EA);
      border-radius: var(--radius-yorliq, 6px);
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .fk-header-izoh {
      margin: 4px 0 0;
      font-size: var(--matn-kichik, 12px);
      color: var(--matn-ikkinchi, #696D75);
      max-width: 560px;
    }

    .fk-asosiy { padding: var(--oraliq-6, 32px) var(--konteyner-padding, 16px) var(--oraliq-8, 64px); }

    /* ---------- Ro'yxat ekrani ---------- */
    .fk-royxat-bosh h1 { margin: 0 0 4px; }
    .fk-progress-matn { margin: 0 0 var(--oraliq-3, 12px); color: var(--matn-ikkinchi, #696D75); font-size: var(--matn-asosiy, 14px); }
    .fk-qizil { color: var(--matn-qizil, #C4000F); font-weight: 700; }
    .fk-progress-matn-kichik { margin: 2px 0 0; color: var(--matn-ikkinchi, #696D75); font-size: var(--matn-kichik, 12px); }
    .fk-progress-track { height: 8px; border-radius: 999px; background: var(--kul-90, #E3E5EA); overflow: hidden; margin-bottom: var(--oraliq-5, 24px); max-width: 420px; }
    .fk-progress-fill { height: 100%; background: var(--rang-brend, #E60012); border-radius: 999px; transition: width var(--tezlik, .2s ease); }

    .fk-filtr-qatori { display: flex; align-items: center; gap: var(--oraliq-2, 8px); flex-wrap: wrap; margin-bottom: var(--oraliq-4, 16px); }
    .fk-hudud-select {
      height: 36px; border-radius: 999px; border: 1px solid var(--chegara-nozik, #DDE1E7);
      padding: 0 14px; font-size: var(--matn-kichik, 13px); font-family: inherit;
      background: var(--oq, #FFFFFF); color: var(--qora, #141417);
    }

    .fk-jadval-qobiq { overflow-x: auto; background: var(--oq, #FFFFFF); border: 1px solid var(--chegara-nozik, #EEF0F3); border-radius: var(--radius-kartochka, 16px); }
    .fk-jadval { min-width: 780px; }
    .fk-qator-grid { display: grid; grid-template-columns: 1fr 160px 1fr 160px 120px 100px; align-items: center; gap: var(--oraliq-3, 12px); }
    .fk-jadval-bosh {
      padding: 12px 16px; font-size: 11.5px; font-weight: 700; color: var(--matn-ikkinchi, #696D75);
      text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--chegara-nozik, #EEF0F3);
    }
    .fk-qator { background: var(--oq, #FFFFFF); border-bottom: 1px solid var(--chegara-nozik, #EEF0F3); padding: 14px 16px; font-size: var(--matn-asosiy, 14px); }
    .fk-qator:last-child { border-bottom: 0; }
    .fk-qator--ochilmagan { background: var(--yuza-ikkilamchi, #F4F6F8); color: var(--matn-uchinchi, #75767E); }
    .fk-qator-nomi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .fk-qator-nomi strong { font-size: var(--matn-asosiy, 14px); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fk-qator-id { font-size: 11.5px; color: var(--matn-ikkinchi, #696D75); }
    .fk-tahrirlash { color: var(--matn-qizil, #C4000F); font-weight: 600; font-size: var(--matn-kichik, 13px); }
    .fk-tahrirlash:hover { text-decoration: underline; }
    .fk-bosh { color: var(--matn-uchinchi, #75767E); }
    .fk-bosh-holat { padding: var(--oraliq-6, 32px); text-align: center; color: var(--matn-ikkinchi, #696D75); }

    .fk-yorliq-sariq {
      display: inline-block; background: var(--sariq-95, #FFF6E5); color: #6B5320;
      border: 1px solid var(--sariq-50, #FFB020); border-radius: var(--radius-yorliq, 6px);
      padding: 2px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    }
    .fk-belgi-ok { color: var(--yashil-45, #0B7A58); font-weight: 700; font-size: 16px; }
    .fk-tag-ochilmagan {
      display: inline-block; background: var(--kul-94, #EDEFF3); color: var(--matn-uchinchi, #75767E);
      border-radius: var(--radius-yorliq, 6px); padding: 2px 8px; font-size: 11.5px; font-weight: 600;
    }

    /* ---------- Forma ekrani ---------- */
    .fk-forma-bosh { margin-bottom: var(--oraliq-5, 24px); }
    .fk-orqaga { display: inline-block; margin-bottom: 8px; color: var(--matn-ikkinchi, #696D75); font-size: var(--matn-kichik, 13px); font-weight: 600; }
    .fk-orqaga:hover { color: var(--qora, #141417); }
    .fk-forma-bosh h1 { margin: 0; }

    #fk-forma {
      max-width: 720px; background: var(--oq, #FFFFFF); border: 1px solid var(--chegara-nozik, #EEF0F3);
      border-radius: var(--radius-blok, 24px); padding: var(--oraliq-6, 32px);
    }
    .fk-forma-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--oraliq-4, 16px); }
    .maydon--keng { grid-column: 1 / -1; }
    #fk-forma .maydon input, #fk-forma .maydon select { min-height: 46px; }
    #fk-forma .maydon input:disabled { background: var(--yuza-ikkilamchi, #F4F6F8); color: var(--matn-ikkinchi, #696D75); }

    .fk-blok-sarlavha { margin: var(--oraliq-6, 32px) 0 var(--oraliq-3, 12px); padding-top: var(--oraliq-4, 16px); border-top: 1px solid var(--chegara-nozik, #EEF0F3); }

    .fk-radio-qator { display: flex; gap: var(--oraliq-5, 24px); margin-bottom: var(--oraliq-4, 16px); flex-wrap: wrap; }
    .fk-radio-qator label { display: flex; align-items: center; gap: 8px; font-size: var(--matn-asosiy, 14px); cursor: pointer; }

    input[type="radio"], input[type="checkbox"] { accent-color: var(--rang-brend, #E60012); width: 18px; height: 18px; cursor: pointer; }

    .fk-kunlar-blok { display: flex; flex-direction: column; gap: 10px; margin-bottom: var(--oraliq-4, 16px); }
    .fk-kun-qator { display: grid; grid-template-columns: 96px 1fr 16px 1fr 120px; align-items: center; gap: 8px; }
    .fk-kun-nomi { font-size: var(--matn-kichik, 13px); font-weight: 600; color: var(--matn-ikkinchi, #696D75); }
    .fk-kun-qator input[type="time"] {
      width: 100%; height: 40px; border: 1px solid var(--chegara-kuchli, #D5D7DD);
      border-radius: var(--radius-maydon, 12px); padding: 0 10px; font-family: inherit;
    }
    .fk-kun-chiziq { text-align: center; color: var(--matn-uchinchi, #75767E); }
    .fk-dam-belgi { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--matn-ikkinchi, #696D75); white-space: nowrap; }

    .fk-havola-natija { font-size: 12.5px; margin: -8px 0 var(--oraliq-4, 16px); min-height: 16px; }
    .fk-havola-natija--ok { color: var(--yashil-45, #0B7A58); font-weight: 600; }
    .fk-havola-natija--xato { color: var(--matn-qizil, #C4000F); font-weight: 600; }

    .fk-xarita-oldindan {
      margin-bottom: var(--oraliq-4, 16px); border-radius: var(--radius-kartochka, 16px);
      overflow: hidden; border: 1px solid var(--chegara-nozik, #EEF0F3); height: 220px;
    }
    .fk-xarita-oldindan iframe { width: 100%; height: 100%; border: 0; display: block; }

    .fk-kalit-qator { display: flex; align-items: center; gap: 10px; margin-bottom: var(--oraliq-3, 12px); cursor: pointer; font-size: var(--matn-asosiy, 14px); }
    .fk-kalit { position: relative; display: inline-block; width: 40px; height: 23px; flex: none; }
    .fk-kalit input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .fk-kalit-trek { position: absolute; inset: 0; background: #D9DDE3; border-radius: 999px; transition: background var(--tezlik, .2s ease); pointer-events: none; }
    .fk-kalit-trek::before {
      content: ""; position: absolute; top: 2.5px; left: 3px; width: 18px; height: 18px;
      background: #FFFFFF; border-radius: 50%; transition: transform var(--tezlik, .2s ease);
      box-shadow: 0 1px 2px rgba(20, 20, 23, .2);
    }
    .fk-kalit input:checked + .fk-kalit-trek { background: var(--rang-brend, #E60012); }
    .fk-kalit input:checked + .fk-kalit-trek::before { transform: translateX(17px); }

    .fk-eslatma { font-size: 11.5px; color: var(--matn-uchinchi, #75767E); margin: 0 0 var(--oraliq-5, 24px); }

    .fk-tugmalar-qatori {
      display: flex; justify-content: flex-end; gap: var(--oraliq-3, 12px); flex-wrap: wrap;
      padding-top: var(--oraliq-4, 16px); border-top: 1px solid var(--chegara-nozik, #EEF0F3);
    }

    .fk-kirish-xato { border-color: var(--matn-qizil, #C4000F) !important; box-shadow: 0 0 0 3px rgba(230, 0, 18, 0.13); }

    .fk-xato-holat {
      max-width: 560px; margin: var(--oraliq-8, 64px) auto; text-align: center;
      border: 1px dashed #D3D8DF; border-radius: 14px; padding: 28px 22px; background: #FCFCFD;
    }
    .fk-xato-holat code { background: var(--kul-94, #EDEFF3); padding: 1px 5px; border-radius: 4px; }

    .fk-toast-joy { position: fixed; right: 16px; bottom: 16px; z-index: 500; }
    .fk-toast {
      display: flex; align-items: center; gap: 10px; background: var(--oq, #FFFFFF);
      border: 1px solid var(--chegara-nozik, #EEF0F3); box-shadow: var(--soya-suzuvchi, 0 10px 26px rgba(20, 20, 23, .13));
      border-radius: 13px; padding: 12px 16px; font-size: 13.5px; font-weight: 600; max-width: 340px;
    }
    .fk-toast-belgi { font-weight: 800; }
    .fk-toast--ok .fk-toast-belgi { color: var(--yashil-45, #0B7A58); }
    .fk-toast--xato .fk-toast-belgi { color: var(--matn-qizil, #C4000F); }

    @media (max-width: 760px) {
      .fk-qator-grid { grid-template-columns: 1fr; row-gap: 6px; }
      .fk-jadval { min-width: 0; }
      .fk-jadval-bosh { display: none; }
      .fk-qator { border: 1px solid var(--chegara-nozik, #EEF0F3); border-radius: 12px; margin: 10px; padding: 14px; }
      .fk-jadval-qobiq { border: 0; background: transparent; }
      .fk-forma-grid { grid-template-columns: 1fr; }
      .fk-kun-qator { grid-template-columns: 1fr 1fr; row-gap: 6px; }
      .fk-kun-nomi { grid-column: 1 / -1; }
      #fk-forma { padding: var(--oraliq-4, 16px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fk-progress-fill, .fk-kalit-trek, .fk-kalit-trek::before { transition: none; }
    }
  </style>
</head>
<body class="fk-body">

  <noscript>
    <div class="fk-xato-holat">Bu asbob ishlashi uchun brauzeringizda JavaScript yoqilgan bo'lishi kerak.</div>
  </noscript>

  <header class="fk-header">
    <div class="konteyner fk-header-ichki">
      <div>
        <div class="fk-header-nom">ARZONCHI<span class="logo-nuqta">.</span> <span class="fk-header-belgi">Filial kiritish</span></div>
        <p class="fk-header-izoh">Lokal asbob — internetga ulanmasdan ham ishlaydi. Barcha o'zgarish shu brauzerda (localStorage) saqlanadi, hech qayerga yuborilmaydi.</p>
      </div>
      <button type="button" class="tugma tugma-asosiy" id="fk-eksport-tugma">Eksport qilish</button>
    </div>
  </header>

  <main class="konteyner fk-asosiy">
    <section id="fk-ekran-royxat" aria-label="Filiallar ro'yxati"></section>
    <section id="fk-ekran-forma" aria-label="Filialni tahrirlash" hidden></section>
  </main>

  <div id="fk-toast-joy" class="fk-toast-joy" aria-live="polite" hidden></div>

  <script src="js/malumotlar-filial.js"></script>
  <script src="js/filial-kirish.js"></script>
</body>
</html>
